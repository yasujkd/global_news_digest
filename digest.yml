name: 海外ニュース朝刊

on:
  schedule:
    # 日本時間 月〜土 05:30(=UTC 日〜金 20:30)。GitHubの混雑で数十分遅れることがあります
    - cron: "30 20 * * 0-5"
  workflow_dispatch: {}   # Actions画面から手動実行も可能
  push:
    branches: [main]      # ファイルをアップロード・編集したときにも実行して公開ページを更新

permissions:
  contents: write   # 過去分(docs/archive)をリポジトリに保存するため
  pages: write      # GitHub Pages に公開するため
  id-token: write   # 同上(GitHub Pagesの必須設定)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: python digest.py
      - name: Save archive to repository
        run: |
          touch docs/.nojekyll
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add docs
          git commit -m "digest $(TZ=Asia/Tokyo date +%F)" || echo "no changes"
          git push || echo "push skipped"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
